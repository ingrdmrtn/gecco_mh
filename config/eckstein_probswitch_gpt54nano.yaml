slurm:
  cpus_per_task: 16   # HBI and recovery simulation both parallelise across subjects
  partition: "interruptible_cpu"

loop:
  max_iterations: 10
  max_independent_runs: 1

task:
  # v2: restricted to the paper's N=291 analysis sample, task description
  # corrected against the paper, and baseline swapped to the paper's winning
  # 4-parameter RL model. Results are NOT comparable to v1 — different data,
  # different baseline — hence the new results directory.
  # v3: adds PDS (pubertal status) to individual_differences_eval. Individual
  # differences feed the LLM feedback, so this changes the search trajectory,
  # not just the reporting -- hence a new results directory rather than
  # appending to v2's registry with different R2 semantics.
  name: "eckstein_probswitch_gpt54nano_v3"
  description: |
    In this task, the participant makes a sequence of choices to earn reward.
    On each trial, they choose one of two boxes. The chosen box either reveals
    a reward (a gold coin) or is empty. One box is the "correct" side: it pays
    out on about 75% of choices. The other box NEVER pays out — its reward
    probability is exactly zero. This asymmetry is important: receiving a
    reward proves with certainty that the chosen box is currently the correct
    one, whereas receiving nothing is only weak evidence against it, because
    the correct box stays empty on roughly a quarter of choices.

    The correct side reverses unpredictably. A reversal becomes possible only
    once the participant has collected a criterion number of rewards in the
    current block (randomised per block, roughly 5-15 rewards), and reversals
    only ever occur immediately after a rewarded trial. So the chance of a
    reversal grows with the number of rewards banked since the last one, and a
    reward followed by a run of non-rewards is the diagnostic signature of a
    reversal that has just happened.

    The participant must track which box is currently correct, tolerate the
    frequent unrewarded trials that occur even when choosing correctly, and
    switch when they detect that the contingencies have changed.

  goal: |
    Your task: Propose **{models_per_iteration} new cognitive models** as Python functions:
    {model_names}

data:
  max_prompt_trials: 30
  path: "data/preprocessed_eckstein.csv"
  id_column: "participant"
  input_columns: ["selected_box", "reward"]
  data2text_function: "narrative"

  narrative_template: |
    The participant chose box {selected_box} and received {reward} reward.

  value_mappings:
    selected_box:
      "0": "L"
      "1": "R"

  splits:
    prompt: "[1:3]"

llm:
  provider: "openrouter"
  base_model: "openai/gpt-5.4-nano"
  max_tokens: 16384
  system_prompt: |
    You are a senior postdoctoral researcher in psychology and computational
    neuroscience with a background in RL, computational modelling, python,
    and linear algebra. You have expertise in Bayesian modelling, decision-making,
    and probability theory.
    You will be given participant data from a two-armed probabilistic
    reversal-learning task (a bandit task where the rewarded option switches
    unpredictably over time).
    Your job is to propose cognitive models, expressed as Python functions,
    that explain how participants make their decisions over time.

  models_per_iteration: 1
  include_feedback: true
  structured_output: true
  supports_json_schema: true
  analysis_scratchpad: true

  reviewer:
    enabled: true
    persona: |
      You are an expert code reviewer for computational cognitive models.
      Your PhD is in computational neuroscience with 10+ years of experience
      debugging reinforcement learning models, likelihood functions, and
      hierarchical Bayesian models. You identify bugs BEFORE code execution.
    focus_areas:
      - numerical_stability
      - rl_correctness
      - initialization
      - parameter_bounds
      - choice_indexing
      - likelihood_correctness
    issue_types:
      critical: "Will cause runtime errors or NaN values"
      warning: "May cause numerical issues in edge cases"
      info: "Minor improvement or style suggestion"

  guardrails:
    - "Each model must be a standalone Python function."
    - "Function names must be `cognitive_model1`, `cognitive_model2`, etc."
    - "Take as input: `action, reward, model_parameters`."
    - "Missed-response trials are flagged with `action == -1` (and `reward == -1`). These cannot be modelled: at the top of the trial loop, skip them with `if action[trial] == -1: continue` BEFORE using `action[trial]` as an index, and do not update any values or include them in the likelihood. Initialise `p_choice = np.ones(n_trials)` so skipped trials contribute `log(1) = 0`."
    - "Return the **negative log-likelihood** of observed choices."
    - "Use all parameters meaningfully (no unused params)."
    - "Include a clear docstring for the model and each parameter."
    - "Parameter bounds: [0,1] for most; [0,10] for softmax `beta` (inverse temperature). Please refer to the template for how these are defined."
    - "Numerical stability is mandatory: every softmax must subtract the maximum Q/value before calling `np.exp`; never compute `np.exp(beta * values)` directly."
    - "Every probability used in `np.log` must be clipped or guarded with epsilon inside the log, e.g. `np.log(max(prob, 1e-10))`; never take `np.log` of zero, negative, NaN, or inf values."
    - "All probability denominators must be strictly positive and finite. If a denominator could be zero, add a small epsilon or use a stable fallback that returns valid probabilities summing to 1."
    - "Initialize all arrays and scalar accumulators explicitly with finite values. Do not use uninitialized `np.empty` values before assigning every element."
    - "Do not introduce mathematically invalid operations such as division by zero, square roots/logs of invalid values, unconstrained probabilities outside [0,1], or parameter bounds that conflict with the declared parameter meanings."
    - "Do NOT include any package imports inside the code you write. Assume all packages are already imported."
    - "Use the `@njit` decorator on the cognitive_model function for improved performance. Numba is already imported and available."
    - "IMPORTANT: Code runs under Numba @njit (nopython mode). Do NOT use `np.max(arr, axis=N)`, `np.min(arr, axis=N)`, or `np.argmax(arr, axis=N)` — Numba does not support the axis= keyword on these functions. Instead use an explicit loop: `for i in range(arr.shape[0]): result[i] = arr[i].max()` for row-wise max."

  template_model: |
    @njit
    def cognitive_model(action, reward, model_parameters):
        """Example model illustrating format only (do not reuse logic).
        Single-stage two-armed bandit Q-learning.
        Bounds:
        learning_rate: [0,1]
        beta: [0,10]
        """
        learning_rate, beta = model_parameters
        n_trials = len(action)

        q = np.zeros(2)
        p_choice = np.ones(n_trials)  # missed trials stay 1.0 -> log(1) = 0

        for trial in range(n_trials):
            if action[trial] == -1:   # missed response: cannot be modelled
                continue
            logits = beta * q
            logits = logits - logits.max()
            exp_q = np.exp(logits)
            probs = exp_q / np.sum(exp_q)
            p_choice[trial] = probs[action[trial]]

            delta = reward[trial] - q[action[trial]]
            q[action[trial]] += learning_rate * delta

        eps = 1e-10
        log_loss = -np.sum(np.log(p_choice + eps))
        return log_loss

evaluation:
  metric: "bic"
  optimizer: "L-BFGS-B"
  eval_test_split: 0.7
  split_seed: 42
  fit_type: "group"

validation:
  retry_limit: 3  # Max retries for Pydantic validation errors per model

parameter_recovery:
  enabled: true
  n_subjects: 50
  n_trials: 130          # real data: mean 131.5 trials/participant
  threshold: 0.5
  n_fitting_starts: 3
  simulator: "probswitch"
  # Contingencies estimated from data/preprocessed_eckstein.csv:
  # P(reward|correct)=0.767, P(reward|incorrect)=0.000, and reversals follow
  # a criterion of ~Uniform{5..15} collected rewards (mean 9.4).
  #
  # NOTE: the paper states the criterion was 7-15 rewards, but only 72% of
  # observed blocks fall in that range — rewards-per-block runs 5-15 with clear
  # mass at 5 and 6 (326 and 243 blocks). We use the empirical 5-15 because the
  # simulator should reproduce the environment participants actually faced.
  # There is no post-criterion delay to model: the negative `trialsinceswitch`
  # values in the raw files are a fixed 4-trial peri-switch label (exactly 4 in
  # all 2198 blocks), not a task mechanic.
  simulator_config:
    p_reward: 0.75
    p_reward_incorrect: 0.0
    reward_criterion: [5, 15]

baseline:
  # The winning model from Eckstein et al. (2022, Dev Cogn Neurosci), which
  # beat a 4-parameter Bayesian inference model on WAIC (23492+/-201 vs
  # 23603+/-200) on exactly this dataset. Using it as the baseline means GeCCo's
  # BIC improvements are measured against the published state of the art rather
  # than against a weaker textbook model.
  model: |
    @njit
    def rl_counterfactual_valence(action, reward, model_parameters):
      """
      Four-parameter RL model with counterfactual updating and
      valence-specific learning rates, for a two-armed reversal bandit.

      Both boxes are updated on every trial: the chosen box towards the
      observed outcome (factual) and the unchosen box towards its complement
      (counterfactual). Counterfactual updating is justified here because the
      incorrect box never pays out, so an observed reward is conclusive
      evidence about which box is correct. Factual and counterfactual updates
      share a learning rate within each outcome valence.

      Parameters:
          - alpha_pos: Learning rate following rewarded outcomes [0, 1]
          - alpha_neg: Learning rate following unrewarded outcomes [0, 1]
          - beta: Inverse temperature for choices [0, 10]
          - persistence: Tendency to repeat the previous action [-1, 1]
      """
      alpha_pos, alpha_neg, beta, persistence = model_parameters
      n_trials = len(action)

      # Values represent P(box is correct); start at an unbiased 0.5
      q = np.zeros(2)
      q[0] = 0.5
      q[1] = 0.5
      prev_action_indicator = np.zeros(2)
      p_choice = np.ones(n_trials)  # missed trials stay 1.0 -> log(1) = 0

      for trial in range(n_trials):
          a = action[trial]
          if a == -1:   # missed response: cannot be modelled
              continue

          q_with_pers = beta * q + persistence * prev_action_indicator
          logits = q_with_pers - q_with_pers.max()
          exp_q = np.exp(logits)
          probs = exp_q / np.sum(exp_q)
          p_choice[trial] = probs[a]

          r = reward[trial]
          other = 1 - a
          alpha = alpha_pos if r == 1 else alpha_neg

          # Factual update on the chosen box
          q[a] += alpha * (r - q[a])
          # Counterfactual update on the unchosen box, towards the complement
          q[other] += alpha * ((1.0 - r) - q[other])

          prev_action_indicator.fill(0)
          prev_action_indicator[a] = 1

      eps = 1e-10
      log_loss = -np.sum(np.log(p_choice + eps))
      return log_loss

  # The paper's other winning model. Eckstein et al. fitted an RL family and a
  # Bayesian inference family and found them complementary: RL won on WAIC
  # (23492+/-201 vs 23603+/-200) but both reproduced every qualitative age
  # effect, and the BI parameters were near-perfectly predicted by the RL ones.
  # Since our metric is BIC on held-out participants rather than WAIC, the
  # ranking here is genuinely open. Comparators are fitted and reported
  # alongside the baseline; they do not feed the search or early stopping.
  comparators:
    - name: "bayesian_inference_4param"
      model: |
        @njit
        def bayesian_inference_reversal(action, reward, model_parameters):
          """
          Four-parameter Bayesian inference model for a two-armed reversal
          bandit, tracking a belief about which box is currently correct.

          The agent holds a belief b[i] = P(box i is currently correct). After
          each outcome it applies Bayes' rule using its subjective reward
          probability, then propagates the belief through a subjective switch
          probability to account for volatility. Because the incorrect box
          never pays, a reward drives the belief to certainty; an omission is
          only partial evidence. p_reward and p_switch are free parameters
          representing the participant's mental model of the task, which need
          not match the true values (0.75 and roughly 0.05).

          Parameters:
              - beta: Inverse temperature for choices [0, 10]
              - persistence: Tendency to repeat the previous action [-1, 1]
              - p_reward: Subjective reward probability, correct box [0.5, 1]
              - p_switch: Subjective probability of a reversal [0, 0.5]
          """
          beta, persistence, p_reward, p_switch = model_parameters
          n_trials = len(action)
          eps = 1e-10

          # Belief that each box is currently the correct one
          b = np.zeros(2)
          b[0] = 0.5
          b[1] = 0.5
          prev_action_indicator = np.zeros(2)
          p_choice = np.ones(n_trials)  # missed trials stay 1.0 -> log(1) = 0

          for trial in range(n_trials):
              a = action[trial]
              if a == -1:   # missed response: cannot be modelled
                  continue

              vals = beta * b + persistence * prev_action_indicator
              vals = vals - vals.max()
              exp_v = np.exp(vals)
              probs = exp_v / np.sum(exp_v)
              p_choice[trial] = probs[a]

              r = reward[trial]
              other = 1 - a

              # Likelihood of the observed outcome under each hypothesis
              if r == 1:
                  lik_correct = p_reward
                  lik_incorrect = 0.0
              else:
                  lik_correct = 1.0 - p_reward
                  lik_incorrect = 1.0

              post_a = b[a] * lik_correct
              post_other = b[other] * lik_incorrect
              denom = post_a + post_other
              if denom < eps:
                  posterior = 0.5
              else:
                  posterior = post_a / denom

              # Volatility: the correct box may reverse before the next trial
              posterior = posterior * (1.0 - p_switch) + (1.0 - posterior) * p_switch
              b[a] = posterior
              b[other] = 1.0 - posterior

              prev_action_indicator.fill(0)
              prev_action_indicator[a] = 1

          log_loss = -np.sum(np.log(p_choice + eps))
          return log_loss

feedback:
  type: "llm"

individual_differences_eval:
  data_path: "data_EcksteinEtAl_eLife2022_ProbSwitch/EcksteinEtAl_eLife2022_Demographics.csv"
  id_column: "sID"                # participant id column in the demographics file
  behavioral_id_column: "subject_id"  # join key in the trial data (= sID)
  # PreciseYrs = age in years; PDS = Pubertal Development Scale (1-4).
  #
  # Cost of including PDS, measured on this sample: PDS is present for 170 of
  # the 291 participants (58%), so the eval-split regression drops from 202/202
  # complete rows to 116/202 -- evaluate_individual_differences discards any row
  # with a NaN in any feature. PDS is also 0.74 correlated with age here, so the
  # two predictors are largely redundant and their individual coefficients are
  # not interpretable; the reported R2 is joint explained variance, which is
  # still meaningful. Alternatives with the same coverage: Category,
  # Columbia_cat. meanT (testosterone) has better coverage at 76%.
  predictors: ["PreciseYrs", "PDS"]
  covariates: ["Gender"]

# ---------------------------------------------------------------------------
# Client profiles for distributed parallel search
# Each profile overrides LLM settings for a specific search strategy.
# Launch with: sbatch bash/run_gecco_distributed.sh eckstein_probswitch_gpt54nano.yaml
# ---------------------------------------------------------------------------
clients:
  exploit:
    llm:
      system_prompt_suffix: |
        Focus on refining and improving the best-performing model(s) so far.
        Make small, targeted changes to parameters and mechanisms. Try
        variations on the current best architecture — e.g. adding or
        removing a single parameter, changing how Q-values are updated,
        or adjusting the choice rule.

  explore:
    llm:
      system_prompt_suffix: |
        Be creative and try fundamentally different model architectures.
        Consider cognitive mechanisms not yet explored, such as:
        - Attention or salience-based choice mechanisms
        - Forgetting or memory decay of unchosen values
        - Habit formation or perseveration
        - Separate learning rates for positive vs negative outcomes
        - Change-point / reversal detection
        Do not simply tweak existing models — propose structurally novel ones.
        Treat the feedback about previous models as informative but not constraining.
      extra_guardrails:
        - "Each model must use at least one mechanism not present in any previous model."

  minimal:
    llm:
      system_prompt_suffix: |
        Propose simple, parsimonious models with few free parameters.
        Prioritise models with 2-3 parameters that capture the core
        computational mechanisms. A simpler model with a slightly worse
        likelihood can still win on BIC due to the complexity penalty.
        Avoid adding parameters unless they meaningfully reduce the
        negative log-likelihood.
      extra_guardrails:
        - "Each model should have at most 3 free parameters."

  complex:
    llm:
      system_prompt_suffix: |
        Propose complex models that incorporate multiple cognitive mechanisms
        and have many free parameters (maximum of 10). Propose models that
        track various latent variables. Consider whether non-linear
        operations could improve fit. Don't worry about parsimony —
        focus on capturing the full complexity of the data.

  bayesian:
    llm:
      system_prompt_suffix: |
        Propose models that use approximate Bayesian inference to learn and
        make decisions (e.g., Beta learning models). Consider how the agent
        might represent uncertainty about which box is currently rewarded,
        and how this uncertainty could influence choices.

  latent_state_inference:
    llm:
      system_prompt_suffix: |
        Propose models that incorporate latent state inference or belief
        updating about the task structure. For example, the agent might
        maintain a belief about which box is currently the rewarded side and
        a belief about whether a reversal has just occurred, updating these
        beliefs over time based on observed rewards. Consider how this belief
        state could drive choices and how reversals are detected.
