slurm:
  cpus_per_task: 32
  partition: cpu
  mem_per_task: 64G
loop:
  max_iterations: 20
  max_independent_runs: 1
  n_clients: 5
task:
  name: deepseekv4flash_judge_llm_all_context_persona_v1
  description: 'In this task, the participant makes a sequence of choices to earn money.

    On each trial, they first select between two images, which probabilistically

    transitions them to one of two possible second-stage screens.

    This transition relies on fixed rules; for example, one image might have a

    70% chance of leading to screen A (a "common" transition) and a 30% chance

    of leading to screen B (a "rare" transition).

    Once in the second stage, the participant chooses between two new images,

    each carrying its own probability of yielding a 25-cent reward.

    Crucially, these reward probabilities drift slowly over time between 25% and 75%,

    meaning the participant must continuously adapt to figure out which final image

    is currently paying out the most.

    '
  goal: 'Your task: Propose **{models_per_iteration} new cognitive models** as Python functions:

    {model_names}

    '
data:
  max_prompt_trials: 30
  path: data_g_2019/preprocessed_study2_no_baseline.csv
  id_column: participant
  input_columns:
  - choice_1
  - state
  - choice_2
  - reward
  data2text_function: narrative
  narrative_template: 'The participant chose spaceship {choice_1}, traveled to second stage
    state {state},

    made choice {choice_2}, and received {reward} coins.

    '
  value_mappings:
    choice_1:
      '0': A
      '1': U
    state:
      '0': X
      '1': Y
    choice_2:
      '0': W
      '1': S
  splits:
    prompt: '[1:3]'
llm:
  provider: openrouter
  base_model: deepseek/deepseek-v4-flash
  max_tokens: 16384
  system_prompt: 'You are a senior postdoctoral researcher in psychology and computational

    neuroscience.

    You will be given participant data from a two-step decision-making task.

    Your job is to propose cognitive models, expressed as Python functions,

    that explain how participants make their decisions over time.

    '
  models_per_iteration: 1
  include_feedback: true
  structured_output: true
  supports_json_schema: true
  analysis_scratchpad: true
  reviewer:
    enabled: true
    persona: 'You are an expert code reviewer for computational cognitive models.

      Your PhD is in computational neuroscience with 10+ years of experience

      debugging reinforcement learning models, likelihood functions, and

      hierarchical Bayesian models. You identify bugs BEFORE code execution.

      '
    focus_areas:
    - numerical_stability
    - rl_correctness
    - initialization
    - parameter_bounds
    - choice_indexing
    - likelihood_correctness
    issue_types:
      critical: Will cause runtime errors or NaN values
      warning: May cause numerical issues in edge cases
      info: Minor improvement or style suggestion
  guardrails:
  - Each model must be a standalone Python function.
  - Function names must be `cognitive_model1`, `cognitive_model2`, etc.
  - 'Take as input: `action_1, state, action_2, reward, model_parameters`.'
  - Return the **negative log-likelihood** of observed choices.
  - Use all parameters meaningfully (no unused params).
  - Include a clear docstring for the model and each parameter.
  - 'Parameter bounds: [0,1] for most; [0,10] for softmax `beta` (inverse temperature). Please
    refer to the template for how these are defined.'
  - Do NOT include any package imports inside the code you write. Assume all packages are
    already imported.
  - Use the `@njit` decorator on the cognitive_model function for improved performance. Numba
    is already imported and available.
  - "IMPORTANT: Code runs under Numba @njit (nopython mode). Do NOT use `np.max(arr, axis=N)`,\
    \ `np.min(arr, axis=N)`, or `np.argmax(arr, axis=N)` \u2014 Numba does not support the\
    \ axis= keyword on these functions. Instead use an explicit loop: `for i in range(arr.shape[0]):\
    \ result[i] = arr[i].max()` for row-wise max."
  template_model: "@njit\ndef cognitive_model(action_1, state, action_2, reward, model_parameters):\n\
    \    \"\"\"Example model illustrating format only (do not reuse logic).\n    Bounds:\n\
    \    learning_rate: [0,1]\n    beta: [0,10]\n    \"\"\"\n    learning_rate, beta = model_parameters\n\
    \    n_trials = len(action_1)\n\n    transition_matrix = np.array([[0.7, 0.3], [0.3, 0.7]])\n\
    \    p_choice_1 = np.zeros(n_trials)\n    p_choice_2 = np.zeros(n_trials)\n    q_stage1_mf\
    \ = np.zeros(2)\n    q_stage2_mf = np.zeros((2, 2))\n\n    for trial in range(n_trials):\n\
    \        max_q_stage2 = np.empty(q_stage2_mf.shape[0])\n        for _s in range(q_stage2_mf.shape[0]):\n\
    \            max_q_stage2[_s] = q_stage2_mf[_s].max()\n        q_stage1_mb = transition_matrix\
    \ @ max_q_stage2\n        exp_q1 = np.exp(beta * q_stage1_mb)\n        probs_1 = exp_q1\
    \ / np.sum(exp_q1)\n        p_choice_1[trial] = probs_1[action_1[trial]]\n        state_idx\
    \ = state[trial]\n        exp_q2 = np.exp(beta * q_stage2_mf[state_idx])\n        probs_2\
    \ = exp_q2 / np.sum(exp_q2)\n        p_choice_2[trial] = probs_2[action_2[trial]]\n  \
    \      delta_stage1 = q_stage2_mf[state_idx, action_2[trial]] - q_stage1_mf[action_1[trial]]\n\
    \        q_stage1_mf[action_1[trial]] += learning_rate * delta_stage1\n        delta_stage2\
    \ = reward[trial] - q_stage2_mf[state_idx, action_2[trial]]\n        q_stage2_mf[state_idx,\
    \ action_2[trial]] += learning_rate * delta_stage2\n\n    eps = 1e-10\n    log_loss =\
    \ -(np.sum(np.log(p_choice_1 + eps)) + np.sum(np.log(p_choice_2 + eps)))\n    return log_loss\n"
judge:
  verbose: true
  max_tool_calls: 20
  diagnostic_store:
    enabled: true
  barrier:
    orchestrator_wait_seconds: 1800
    client_wait_seconds: 1800
  ppc:
    enabled: true
    n_sims: 100
  mode: llm
  context:
    attempted_models: true
    performance: true
    best_model_code: true
    diagnostic: true
    individual_differences: false
  output:
    persona_synthesis: true
evaluation:
  metric: bic
  optimizer: L-BFGS-B
  train_ratio: 0.7
  test_ratio: 0.3
  split_seed: 42
  fit_type: group
validation:
  retry_limit: 3
parameter_recovery:
  enabled: true
  n_subjects: 50
  n_trials: 200
  threshold: 0.5
  n_fitting_starts: 3
  simulator: two_step
  simulator_config:
    transition_probs:
    - - 0.7
      - 0.3
    - - 0.3
      - 0.7
    reward_drift_sd: 0.025
baseline:
  model: "@njit\ndef hybrid_model(action_1, state, action_2, reward, model_parameters):\n\
    \  \"\"\"\n  Hybrid Model-Based and Model-Free Learning with Perseveration and Eligibility\
    \ Traces.\n\n  Parameters:\n      - learning_rate: Learning rate for stage 1 MF updates\
    \ [0, 1]\n      - learning_rate_2: Learning rate for stage 2 MF updates [0, 1]\n     \
    \ - beta: Inverse temperature for stage 1 choices [0, 10]\n      - beta_2: Inverse temperature\
    \ for stage 2 choices [0, 10]\n      - w: Weight on model-based vs. model-free values\
    \ (stage 1) [0, 1]\n      - lambd: Eligibility trace weight [0, 1]\n      - perseveration:\
    \ Tendency to repeat previous stage 1 action [0, 1]\n  \"\"\"\n  learning_rate, learning_rate_2,\
    \ beta, beta_2, w, lambd, perseveration = model_parameters\n  n_trials = len(action_1)\n\
    \n  transition_matrix = np.array([[0.7, 0.3], [0.3, 0.7]])\n  prev_action_indicator =\
    \ np.zeros(2)\n  p_choice_1 = np.zeros(n_trials)\n  p_choice_2 = np.zeros(n_trials)\n\
    \  q_stage1_mf = np.zeros(2)\n  q_stage2_mf = np.zeros((2, 2))\n\n  for trial in range(n_trials):\n\
    \      max_q_stage2 = np.empty(q_stage2_mf.shape[0])\n      for _s in range(q_stage2_mf.shape[0]):\n\
    \          max_q_stage2[_s] = q_stage2_mf[_s].max()\n      q_stage1_mb = transition_matrix\
    \ @ max_q_stage2\n      q_stage1_combined = w * q_stage1_mb + (1 - w) * q_stage1_mf\n\
    \      q_stage1_with_pers = q_stage1_combined + perseveration * prev_action_indicator\n\
    \n      exp_q1 = np.exp(beta * q_stage1_with_pers)\n      probs_1 = exp_q1 / np.sum(exp_q1)\n\
    \      p_choice_1[trial] = probs_1[action_1[trial]]\n\n      state_idx = state[trial]\n\
    \      exp_q2 = np.exp(beta_2 * q_stage2_mf[state_idx])\n      probs_2 = exp_q2 / np.sum(exp_q2)\n\
    \      p_choice_2[trial] = probs_2[action_2[trial]]\n\n      delta_stage1 = q_stage2_mf[state_idx,\
    \ action_2[trial]] - q_stage1_mf[action_1[trial]]\n      q_stage1_mf[action_1[trial]]\
    \ += learning_rate * delta_stage1\n      delta_stage2 = reward[trial] - q_stage2_mf[state_idx,\
    \ action_2[trial]]\n      q_stage2_mf[state_idx, action_2[trial]] += learning_rate_2 *\
    \ delta_stage2\n      q_stage1_mf[action_1[trial]] += lambd * learning_rate * delta_stage2\n\
    \n      prev_action_indicator.fill(0)\n      prev_action_indicator[action_1[trial]] =\
    \ 1\n\n  eps = 1e-10\n  log_loss = -(np.sum(np.log(p_choice_1 + eps)) + np.sum(np.log(p_choice_2\
    \ + eps)))\n  return log_loss\n"
feedback:
  type: llm
individual_differences_eval:
  data_path: data_g_2019/self_report_study2.csv
  id_column: subj
  behavioral_id_column: subject_id
  predictors:
  - Factor1
  - Factor2
  - Factor3
  covariates:
  - age
  - gender
clients:
  exploit:
    llm:
      show_best_model_code: true
      feedback_guidance: 'This client refines the current best model. Emphasise what specifically

        made the best model successful, which parameters matter most, and suggest

        small targeted modifications. Include BIC values and code-level detail.

        '
      system_prompt_suffix: "Focus on refining and improving the best-performing model(s)\
        \ so far.\nMake small, targeted changes to parameters and mechanisms. Try\nvariations\
        \ on the current best architecture \u2014 e.g. adding or\nremoving a single parameter,\
        \ changing how Q-values are updated,\nor adjusting the weighting between model-based\
        \ and model-free\ncomponents.\n"
  explore:
    llm:
      show_best_model_code: false
      feedback_guidance: 'This client seeks structurally novel models. Emphasise which broad

        mechanism classes have NOT been tried yet. De-emphasise incremental

        improvements. Be skeptical of the current best model''s dominance.

        '
      system_prompt_suffix: "Be creative and try fundamentally different model architectures.\n\
        Consider cognitive mechanisms not yet explored, such as:\n- Attention or salience-based\
        \ choice mechanisms\n- Forgetting or memory decay\n- Habit formation or perseveration\n\
        - Separate learning rates for positive vs negative outcomes\n- Hierarchical or meta-learning\
        \ approaches\nDo not simply tweak existing models \u2014 propose structurally novel\
        \ ones.\nTreat the feedback about previous models with a high degree of skepticism.\n"
      extra_guardrails:
      - Each model must use at least one mechanism not present in any previous model.
  minimal:
    llm:
      show_best_model_code: false
      feedback_guidance: 'This client targets parsimony. Highlight which parameters appear

        redundant or unidentifiable. Emphasise the BIC complexity penalty and

        suggest which mechanisms can be dropped without losing much fit.

        '
      system_prompt_suffix: 'Propose simple, parsimonious models with few free parameters.

        Prioritise models with 2-3 parameters that capture the core

        computational mechanisms. A simpler model with a slightly worse

        likelihood can still win on BIC due to the complexity penalty.

        Avoid adding parameters unless they meaningfully reduce the

        negative log-likelihood.

        '
      extra_guardrails:
      - Each model should have at most 3 free parameters.
  hybrid:
    llm:
      show_best_model_code: false
      feedback_guidance: 'This client focuses on model-based / model-free hybrid architectures.

        Highlight how well the MB/MF balance is being exploited and what

        variations on the weighting or arbitration mechanism remain untried.

        '
      system_prompt_suffix: 'Focus specifically on hybrid model-based / model-free architectures.

        Explore different ways to combine MB and MF value signals:

        - Weighted mixtures with a free mixing parameter (w)

        - Arbitration based on uncertainty or conflict

        - State-dependent switching between MB and MF

        - Separate inverse temperatures for MB and MF components

        Also consider whether the transition model is learned or assumed fixed.

        '
  complex:
    llm:
      show_best_model_code: false
      feedback_guidance: 'This client proposes rich, high-parameter models. Highlight which
        latent

        variables or non-linear mechanisms improved fit most, and which parts of

        the data remain poorly explained.

        '
      system_prompt_suffix: "Propose complex models that incorporate multiple cognitive mechanisms\n\
        and have many free parameters (maximum of 10). Propose models that\ntrack various\
        \ latent variables. Consider whether non-linear\noperations could improve fit. Don't\
        \ worry about parsimony \u2014\nfocus on capturing the full complexity of the data.\n"
