slurm:
  cpus_per_task: 8
  partition: "interruptible_cpu"

loop:
  max_iterations: 10
  max_independent_runs: 1

task:
  name: "xia_butterfly_gpt54nano_v1"
  description: |
    In this task (the "butterfly" task), the participant learns which of two
    flowers each butterfly prefers. On each trial one of four butterflies is
    shown, and the participant chooses one of two flowers. The chosen flower
    then either yields a reward or not. Each butterfly has a fixed but
    probabilistic preference: choosing its preferred flower is rewarded with
    high probability (~75%) and the other flower with low probability (~25%).
    The participant must learn, separately for each butterfly, which flower is
    more likely to be rewarded, from noisy trial-by-trial feedback.

  goal: |
    Your task: Propose **{models_per_iteration} new cognitive models** as Python functions:
    {model_names}

data:
  max_prompt_trials: 30
  path: "data/preprocessed_xia_2021_butterfly.csv"
  id_column: "participant"
  input_columns: ["s", "a", "r"]
  data2text_function: "narrative"

  narrative_template: |
    The participant saw butterfly {s}, chose flower {a}, and received {r} reward.

  value_mappings:
    s:
      "0": "B1"
      "1": "B2"
      "2": "B3"
      "3": "B4"
    a:
      "0": "L"
      "1": "R"

  splits:
    prompt: "[1:3]"

llm:
  provider: "openrouter"
  base_model: "openai/gpt-5.4-nano"
  max_tokens: 16384
  system_prompt: |
    You are a senior postdoctoral researcher in psychology and computational
    neuroscience with a background in RL, computational modelling, python,
    and linear algebra. You have expertise in Bayesian modelling, decision-making,
    and probability theory.
    You will be given participant data from a probabilistic stimulus-response
    reinforcement-learning task (the "butterfly" task: on each trial one of
    four stimuli is shown and the participant chooses one of two responses,
    which is then probabilistically rewarded).
    Your job is to propose cognitive models, expressed as Python functions,
    that explain how participants make their decisions over time.

  models_per_iteration: 1
  include_feedback: true
  structured_output: true
  supports_json_schema: true
  analysis_scratchpad: true

  reviewer:
    enabled: true
    persona: |
      You are an expert code reviewer for computational cognitive models.
      Your PhD is in computational neuroscience with 10+ years of experience
      debugging reinforcement learning models, likelihood functions, and
      hierarchical Bayesian models. You identify bugs BEFORE code execution.
    focus_areas:
      - numerical_stability
      - rl_correctness
      - initialization
      - parameter_bounds
      - choice_indexing
      - likelihood_correctness
    issue_types:
      critical: "Will cause runtime errors or NaN values"
      warning: "May cause numerical issues in edge cases"
      info: "Minor improvement or style suggestion"

  guardrails:
    - "Each model must be a standalone Python function."
    - "Function names must be `cognitive_model1`, `cognitive_model2`, etc."
    - "Take as input: `stimulus, action, reward, model_parameters`. `stimulus` is in {0,1,2,3} (which butterfly) and `action` is in {0,1} (which flower)."
    - "Maintain values per stimulus: e.g. a Q-table of shape (4, 2) indexed as `Q[stimulus[trial], action[trial]]`. Choices for a given trial depend only on the values for that trial's stimulus."
    - "Missed-response trials are flagged with `action == -1` (and `reward == -1`). These cannot be modelled: at the top of the trial loop, skip them with `if action[trial] == -1: continue` BEFORE using `action[trial]` as an index, and do not update any values or include them in the likelihood. Initialise `p_choice = np.ones(n_trials)` so skipped trials contribute `log(1) = 0`."
    - "Return the **negative log-likelihood** of observed choices."
    - "Use all parameters meaningfully (no unused params)."
    - "Include a clear docstring for the model and each parameter."
    - "Parameter bounds: [0,1] for most; [0,10] for softmax `beta` (inverse temperature). Please refer to the template for how these are defined."
    - "Numerical stability is mandatory: every softmax must subtract the maximum Q/value before calling `np.exp`; never compute `np.exp(beta * values)` directly."
    - "Every probability used in `np.log` must be clipped or guarded with epsilon inside the log, e.g. `np.log(max(prob, 1e-10))`; never take `np.log` of zero, negative, NaN, or inf values."
    - "All probability denominators must be strictly positive and finite. If a denominator could be zero, add a small epsilon or use a stable fallback that returns valid probabilities summing to 1."
    - "Initialize all arrays and scalar accumulators explicitly with finite values. Do not use uninitialized `np.empty` values before assigning every element."
    - "Do not introduce mathematically invalid operations such as division by zero, square roots/logs of invalid values, unconstrained probabilities outside [0,1], or parameter bounds that conflict with the declared parameter meanings."
    - "Do NOT include any package imports inside the code you write. Assume all packages are already imported."
    - "Use the `@njit` decorator on the cognitive_model function for improved performance. Numba is already imported and available."
    - "IMPORTANT: Code runs under Numba @njit (nopython mode). Do NOT use `np.max(arr, axis=N)`, `np.min(arr, axis=N)`, or `np.argmax(arr, axis=N)` — Numba does not support the axis= keyword on these functions. Instead use an explicit loop: `for i in range(arr.shape[0]): result[i] = arr[i].max()` for row-wise max."

  template_model: |
    @njit
    def cognitive_model(stimulus, action, reward, model_parameters):
        """Example model illustrating format only (do not reuse logic).
        Per-stimulus Q-learning for the butterfly task.
        Bounds:
        learning_rate: [0,1]
        beta: [0,10]
        """
        learning_rate, beta = model_parameters
        n_trials = len(action)

        q = np.zeros((4, 2))            # values per (butterfly, flower)
        p_choice = np.ones(n_trials)    # missed trials stay 1.0 -> log(1) = 0

        for trial in range(n_trials):
            if action[trial] == -1:     # missed response: cannot be modelled
                continue
            s = stimulus[trial]
            logits = beta * q[s]
            logits = logits - logits.max()
            exp_q = np.exp(logits)
            probs = exp_q / np.sum(exp_q)
            p_choice[trial] = probs[action[trial]]

            delta = reward[trial] - q[s, action[trial]]
            q[s, action[trial]] += learning_rate * delta

        eps = 1e-10
        log_loss = -np.sum(np.log(p_choice + eps))
        return log_loss

evaluation:
  metric: "bic"
  optimizer: "L-BFGS-B"
  eval_test_split: 0.7
  split_seed: 42
  fit_type: "group"

validation:
  retry_limit: 3  # Max retries for Pydantic validation errors per model

parameter_recovery:
  enabled: false   # no butterfly simulator in gecco/ yet; disabled for v1

baseline:
  model: |
    @njit
    def q_learning_perseveration(stimulus, action, reward, model_parameters):
      """
      Per-stimulus Q-learning with action perseveration for the butterfly task.

      Parameters:
          - learning_rate: Learning rate for value updates [0, 1]
          - beta: Inverse temperature for choices [0, 10]
          - perseveration: Tendency to repeat the previous flower choice [-1, 1]
      """
      learning_rate, beta, perseveration = model_parameters
      n_trials = len(action)

      q = np.zeros((4, 2))
      prev_action_indicator = np.zeros(2)
      p_choice = np.ones(n_trials)  # missed trials stay 1.0 -> log(1) = 0

      for trial in range(n_trials):
          if action[trial] == -1:   # missed response: cannot be modelled
              continue
          s = stimulus[trial]
          values = beta * q[s] + perseveration * prev_action_indicator
          logits = values - values.max()
          exp_q = np.exp(logits)
          probs = exp_q / np.sum(exp_q)
          p_choice[trial] = probs[action[trial]]

          delta = reward[trial] - q[s, action[trial]]
          q[s, action[trial]] += learning_rate * delta

          prev_action_indicator.fill(0)
          prev_action_indicator[action[trial]] = 1

      eps = 1e-10
      log_loss = -np.sum(np.log(p_choice + eps))
      return log_loss

feedback:
  type: "llm"

individual_differences_eval:
  data_path: "data/preprocessed_xia_2021_butterfly_demographics.csv"
  id_column: "subject_id"          # participant id column in the demographics file
  behavioral_id_column: "subject_id"  # join key in the trial data
  predictors: ["age"]              # add "pds" for pubertal status (has NaNs -> more dropped rows)
  covariates: ["sex"]

# ---------------------------------------------------------------------------
# Client profiles for distributed parallel search
# Each profile overrides LLM settings for a specific search strategy.
# Launch with: sbatch bash/run_gecco_distributed.sh xia_butterfly_gpt54nano.yaml
# ---------------------------------------------------------------------------
clients:
  exploit:
    llm:
      system_prompt_suffix: |
        Focus on refining and improving the best-performing model(s) so far.
        Make small, targeted changes to parameters and mechanisms. Try
        variations on the current best architecture — e.g. adding or
        removing a single parameter, changing how Q-values are updated,
        or adjusting the choice rule.

  explore:
    llm:
      system_prompt_suffix: |
        Be creative and try fundamentally different model architectures.
        Consider cognitive mechanisms not yet explored, such as:
        - Forgetting or memory decay of stimulus-action values
        - Separate learning rates for positive vs negative outcomes
        - Choice perseveration or stimulus-general response biases
        - Generalisation of value across butterflies
        Do not simply tweak existing models — propose structurally novel ones.
        Treat the feedback about previous models as informative but not constraining.
      extra_guardrails:
        - "Each model must use at least one mechanism not present in any previous model."

  minimal:
    llm:
      system_prompt_suffix: |
        Propose simple, parsimonious models with few free parameters.
        Prioritise models with 2-3 parameters that capture the core
        computational mechanisms. A simpler model with a slightly worse
        likelihood can still win on BIC due to the complexity penalty.
        Avoid adding parameters unless they meaningfully reduce the
        negative log-likelihood.
      extra_guardrails:
        - "Each model should have at most 3 free parameters."

  complex:
    llm:
      system_prompt_suffix: |
        Propose complex models that incorporate multiple cognitive mechanisms
        and have many free parameters (maximum of 10). Propose models that
        track various latent variables. Consider whether non-linear
        operations could improve fit. Don't worry about parsimony —
        focus on capturing the full complexity of the data.

  working_memory:
    llm:
      system_prompt_suffix: |
        Propose models that combine incremental reinforcement learning with a
        fast but capacity-limited and decaying working-memory module (RLWM).
        Consider how a working-memory component might store recent
        stimulus-action-reward associations exactly but forget over time, how
        it might be capacity-limited across the four butterflies, and how its
        outputs could be mixed with slower RL value estimates to drive choices.

  bayesian:
    llm:
      system_prompt_suffix: |
        Propose models that use approximate Bayesian inference to learn and
        make decisions (e.g., Beta learning models). Consider how the agent
        might represent uncertainty about each butterfly's preferred flower,
        and how this uncertainty could influence choices.
