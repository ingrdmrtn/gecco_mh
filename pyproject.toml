[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gecco-mh"
version = "0.1.0"
description = "Guided Generation of Computational Cognitive Models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.59",
    "bottleneck>=1.4",
    "torch>=2.2",
    "numexpr>=2.10",
    "transformers>=4.43",
    "pydantic>=2.8",
    "typing-extensions>=4.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "python-dotenv",
    "openai",
    "accelerate",
    "ipdb",
    "google-genai",
    "seaborn",
    "statsmodels",
    "matplotlib",
    "duckdb>=0.10",
    "sentry-sdk>=2.0",
    "orjson>=3.9",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = [
    "streamlit>=1.44",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["gecco*"]
